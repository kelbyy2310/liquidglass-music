name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Tao project Expo va cai thu vien
        run: |
          npx create-expo-app@latest app --template blank --yes
          cp App.js app.json app/
          cd app
          npx expo install expo-audio expo-document-picker expo-linear-gradient react-native-svg @react-native-community/slider react-native-safe-area-context expo-blur expo-glass-effect

      - name: Build APK
        working-directory: app
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nghe-nhac-apk
          path: app/android/app/build/outputs/apk/release/*.apk
